name: Build HamClock Raspberry Pi images

on:
  workflow_dispatch:
    inputs:
      hamclock_version:
        description: 'HamClock version to install, e.g. "4.22" (blank = latest release)'
        required: false
        default: ''
      hamclock_size:
        description: 'HamClock build size'
        required: false
        default: '800x480'
        type: choice
        options:
          - 800x480
          - 1600x960
          - 2400x1440
          - 3200x1920
      autostart:
        description: 'Start HamClock automatically on boot'
        required: false
        default: 'y'
        type: choice
        options: ['y', 'n']
      publish_release:
        description: 'Also publish the built images to a GitHub Release'
        required: false
        default: false
        type: boolean
  # Uncomment to also rebuild automatically, e.g. every Sunday:
  # schedule:
  #   - cron: '0 6 * * 0'

# Needed for the publish job to create a release and upload assets.
permissions:
  contents: write

# Avoid piling up overlapping multi-hour builds if you trigger this a lot.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # ----- Current Raspberry Pi OS release (Trixie) -----
          - name: trixie-web
            codename: trixie
            variant: web
            arch: arm64
            # Always resolves to the newest published arm64 Lite image.
            base_image: https://downloads.raspberrypi.org/raspios_lite_arm64_latest
            build_mode: web
            image_additional_mb: 2048

          - name: trixie-hardware
            codename: trixie
            variant: hardware
            arch: arm64
            # Always resolves to the newest published arm64 Desktop image.
            base_image: https://downloads.raspberrypi.org/raspios_arm64_latest
            build_mode: hardware
            image_additional_mb: 3072

          - name: trixie-fb0
            codename: trixie
            variant: fb0
            arch: arm64
            # fb0 needs no desktop at all, same Lite image as web.
            base_image: https://downloads.raspberrypi.org/raspios_lite_arm64_latest
            build_mode: fb0
            image_additional_mb: 2048

          - name: trixie-fb0-32bit
            codename: trixie
            variant: fb0
            arch: armhf
            # 32-bit build matching a confirmed-working community recipe
            # for fb0 on real HDMI hardware. Untested by us against the
            # arm64 fb0 build above -- kept as a separate artifact so both
            # can be tried.
            base_image: https://downloads.raspberrypi.org/raspios_lite_armhf_latest
            build_mode: fb0
            image_additional_mb: 2048

          # ----- Previous Raspberry Pi OS release (Bookworm) -----
          # Pinned to a specific dated build (Raspberry Pi doesn't publish a
          # "latest bookworm" alias once a newer codename exists). To
          # refresh these later, pick a newer date folder from:
          #   https://downloads.raspberrypi.com/raspios_lite_arm64/images/
          #   https://downloads.raspberrypi.com/raspios_arm64/images/
          - name: bookworm-web
            codename: bookworm
            variant: web
            arch: arm64
            base_image: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2025-05-13/2025-05-13-raspios-bookworm-arm64-lite.img.xz
            build_mode: web
            image_additional_mb: 2048

          - name: bookworm-hardware
            codename: bookworm
            variant: hardware
            arch: arm64
            base_image: https://downloads.raspberrypi.com/raspios_arm64/images/raspios_arm64-2025-05-13/2025-05-13-raspios-bookworm-arm64.img.xz
            build_mode: hardware
            image_additional_mb: 3072

          - name: bookworm-fb0
            codename: bookworm
            variant: fb0
            arch: arm64
            base_image: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2025-05-13/2025-05-13-raspios-bookworm-arm64-lite.img.xz
            build_mode: fb0
            image_additional_mb: 2048

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Build ${{ matrix.name }} image with HamClock
        id: build
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: ${{ matrix.base_image }}
          cpu: cortex-a53
          image_additional_mb: ${{ matrix.image_additional_mb }}
          copy_repository_path: /home/hamclock-build
          commands: |
            set -e

            export HC_NONINTERACTIVE=1
            export HC_ALLOW_SUDO=1
            export HC_BUILD_MODE="${{ matrix.build_mode }}"
            export HC_SIZE="${{ github.event.inputs.hamclock_size || '800x480' }}"
            export HC_AUTOSTART="${{ github.event.inputs.autostart || 'y' }}"

            chmod +x debian/install-hc-rpi
            cd /root

            VERSION_ARG=""
            if [ -n "${{ github.event.inputs.hamclock_version }}" ]; then
              VERSION_ARG="-t ${{ github.event.inputs.hamclock_version }}"
            fi

            # arm-runner-action mounts the boot partition at /boot, but
            # Bookworm/Trixie kernel packages expect it at /boot/firmware.
            # Alias the two so kernel postinst scripts (pulled in as a
            # dependency of linux-libc-dev) don't fail during apt install.
            mkdir -p /boot/firmware
            mount --bind /boot /boot/firmware

            # fb0 builds draw directly to the legacy /dev/fb0 device, which
            # doesn't behave correctly under Raspberry Pi OS's default
            # KMS/DRM graphics driver. Disable it so the classic framebuffer
            # driver is used instead. (web/hardware variants don't touch
            # /dev/fb0 at all, so this is left alone for them.)
            if [ "${{ matrix.variant }}" = "fb0" ]; then
              sed -i 's/^dtoverlay=vc4-kms-v3d/#dtoverlay=vc4-kms-v3d/' /boot/firmware/config.txt
            fi

            # Default locale: en_US.UTF-8 instead of Raspberry Pi OS's
            # stock en_GB.UTF-8.
            apt-get -y -o Acquire::Check-Valid-Until=false update
            apt-get -y install locales
            sed -i 's/^# *\(en_US.UTF-8 UTF-8\)/\1/' /etc/locale.gen
            locale-gen
            update-locale LANG=en_US.UTF-8

            # Default login: pi / pi.
            #
            # This uses the same userconf.txt mechanism Raspberry Pi Imager
            # itself writes when you preconfigure a user in "Edit settings" --
            # raspberrypi-sys-mods reads this on first boot, creates the
            # account, and skips the interactive username/password wizard
            # entirely. SECURITY NOTE: pi/pi is a widely-known default, and
            # SSH is enabled by default further down -- the MOTD below warns
            # people to change it, but don't publish images built this way
            # somewhere untrusted people can grab them without expecting
            # that reminder to actually get read.
            apt-get -y -o Acquire::Check-Valid-Until=false update
            apt-get -y install openssl
            HC_HASH=$(openssl passwd -6 'pi')
            echo "pi:${HC_HASH}" > /boot/firmware/userconf.txt

            # A little welcome banner on login, with the password warning
            # front and center. Clears out any distro default dynamic MOTD
            # scripts first so nothing else gets appended after it.
            rm -f /etc/update-motd.d/* 2>/dev/null || true
            cat > /etc/motd <<'EOF'

              _   _                 ____ _            _
             | | | | __ _ _ __ ___ / ___| | ___   ___| | __
             | |_| |/ _` | '_ ` _ \| |   | |/ _ \ / __| |/ /
             |  _  | (_| | | | | | | |___| | (_) | (__|   <
             |_| |_|\__,_|_| |_| |_|\____|_|\___/ \___|_|\_\
                                                       de HamClock Pi

              73! Welcome to your HamClock Raspberry Pi.

              *** SECURITY: this device ships with the well-known default
                  login pi/pi. Change it now -- just run: passwd ***

              * No display attached? Open a browser to this Pi's address
                to see HamClock.
              * No WiFi configured yet? Connect to the "HamClock-Setup"
                hotspot from your phone or laptop to get online.

            EOF

            # The Desktop base image should already include Chromium as
            # part of its recommended-software set, but HamClock's
            # local-display mode launches web links, so make sure it's
            # actually there rather than assuming.
            if [ "${{ matrix.variant }}" = "hardware" ]; then
              apt-get -y -o Acquire::Check-Valid-Until=false update
              apt-get -y install chromium
            fi

            # ---------------------------------------------------------------
            # Comitup: WiFi captive-portal onboarding.
            #
            # Anyone with no monitor/keyboard can power this on, connect to
            # the "HamClock-Setup" hotspot it broadcasts, and pick their own
            # WiFi network from a page that pops up automatically -- no
            # Raspberry Pi Imager customization step required.
            # ---------------------------------------------------------------

            # Raspberry Pi OS blocks WiFi by default until a regulatory
            # domain is set, but Comitup's hotspot needs the radio on before
            # that ever happens. Force it on unconditionally on every boot.
            cat > /etc/systemd/system/wifi-on.service <<'EOF'
            [Unit]
            Description=Turn wifi on, regardless of regulatory domain
            After=network.target network-online.target
            Wants=network-online.target

            [Service]
            Type=oneshot
            ExecStart=/usr/bin/nmcli radio wifi on

            [Install]
            WantedBy=NetworkManager.service
            EOF
            systemctl enable wifi-on.service

            # Comitup needs its own repo on Bookworm/Trixie for a compatible
            # python3-networkmanager build (the plain apt-get install comitup
            # from default repos is too old to work reliably).
            curl -L --silent --show-error -o /tmp/comitup-apt-source.deb \
              https://davesteele.github.io/comitup/deb/davesteele-comitup-apt-source_1.3_all.deb
            dpkg -i --force-all /tmp/comitup-apt-source.deb
            rm -f /tmp/comitup-apt-source.deb
            apt-get -y -o Acquire::Check-Valid-Until=false update
            apt-get -y install comitup

            # Let NetworkManager/Comitup own WiFi instead of the older
            # Debian networking stack, per Comitup's install instructions.
            # NOTE: deliberately NOT masking wpa_supplicant.service here --
            # on Bookworm/Trixie, NetworkManager itself D-Bus-activates that
            # exact unit to talk to the radio (client mode and AP/hotspot
            # mode both need it). Masking it leaves the device stuck at
            # NM state 20 (unavailable) forever, since NM can never get a
            # working supplicant. That mask instruction is stale guidance
            # from pre-NetworkManager Raspberry Pi OS (Bullseye and
            # earlier), where wpa_supplicant ran standalone and genuinely
            # conflicted with NetworkManager.
            rm -f /etc/network/interfaces
            systemctl mask dnsmasq.service          || true
            systemctl mask systemd-resolved.service || true
            systemctl mask dhcpcd.service            || true
            systemctl enable NetworkManager.service

            # A recognizable hotspot name instead of the default "comitup-1234".
            echo "ap_name: HamClock-Setup" >> /etc/comitup.conf

            # HamClock (web and fb0 variants) can start before the network
            # is actually up -- neither systemd unit waits for real
            # connectivity, just for the network stack to exist. That race
            # can happen during first-time setup via the hotspot, or on any
            # ordinary reboot. Have Comitup restart the service once the
            # device is genuinely CONNECTED, so it's never stuck
            # serving/rendering a dead/pre-network session.
            if [ "${{ matrix.variant }}" = "web" ] || [ "${{ matrix.variant }}" = "fb0" ]; then
              echo "external_callback: /usr/local/bin/comitup-callback" >> /etc/comitup.conf
              cat > /usr/local/bin/comitup-callback <<'EOF'
            #!/usr/bin/env bash
            if [ "$1" = "CONNECTED" ]; then
                systemctl restart hamclock.service 2>/dev/null || true
            fi
            EOF
              chmod 755 /usr/local/bin/comitup-callback
              chown root:root /usr/local/bin/comitup-callback
            fi

            # Enable SSH by default so the device is reachable once it's on
            # a real network.
            touch /boot/firmware/ssh || true

            set +e
            /home/hamclock-build/debian/install-hc-rpi $VERSION_ARG
            RC=$?
            set -e

            umount /boot/firmware || true

            echo "----- install-hc-rpi.log -----"
            cat /root/install-hc-rpi.log || true
            echo "----- end log -----"
            exit $RC

      - name: Rename and compress image
        run: |
          set -e
          DATE=$(date +%Y-%m-%d)
          SRC="${{ steps.build.outputs.image }}"
          OUT="hamclock-raspios-${{ matrix.codename }}-${{ matrix.variant }}-${{ matrix.arch }}-${DATE}.img"
          mv "$SRC" "$OUT"
          xz -T0 -6 -v "$OUT"
          sha256sum "${OUT}.xz" > "${OUT}.xz.sha256"
          echo "IMAGE_XZ=${OUT}.xz" >> "$GITHUB_ENV"
          echo "IMAGE_SHA=${OUT}.xz.sha256" >> "$GITHUB_ENV"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamclock-raspios-${{ matrix.codename }}-${{ matrix.variant }}-${{ matrix.arch }}
          path: |
            ${{ env.IMAGE_XZ }}
            ${{ env.IMAGE_SHA }}
          retention-days: 14

  publish:
    name: Publish release
    needs: build
    if: ${{ github.event.inputs.publish_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all image artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: hamclock-raspios-*
          merge-multiple: true

      - name: Compute release tag
        id: tag
        run: echo "tag=hamclock-images-$(date +%Y-%m-%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: HamClock Pi images (${{ steps.tag.outputs.tag }})
          files: artifacts/*
          draft: false
          prerelease: false
